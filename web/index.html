<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16182e" />
    <meta name="description" content="🐹 ebiten-template" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>ebiten-template | remarkablegames</title>

    <script
      src="https://unpkg.com/github-corners/dist/embed.min.js"
      data-href="https://github.com/remarkablegames/ebiten-template"
      data-target="_blank"
      async
      defer
    ></script>
    <style>
      .github-corner > svg {
        opacity: 0.5;
        transition: opacity 0.4s;
      }
      .github-corner:hover > svg {
        opacity: 1;
      }
    </style>

    <style>
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000;
        color: #fff;
        font: 16px sans-serif;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to play this game.</noscript>

    <div id="loading">Loading…</div>
    <script src="wasm_exec.js"></script>
    <script>
      // Remove the loading indicator once Ebitengine appends its canvas.
      new MutationObserver((_, observer) => {
        if (document.querySelector("canvas")) {
          document.getElementById("loading").remove();
          observer.disconnect();
        }
      }).observe(document.body, { childList: true });

      const go = new Go();
      WebAssembly.instantiateStreaming(
        fetch("ebiten-template.wasm"),
        go.importObject
      )
        .then((result) => go.run(result.instance))
        .catch(async () => {
          // Fall back if the server doesn't serve .wasm with the JavaScript MIME type.
          const response = await fetch("ebiten-template.wasm");
          const result = await WebAssembly.instantiate(
            await response.arrayBuffer(),
            go.importObject
          );
          go.run(result.instance);
        });
    </script>
  </body>
</html>
