name: build
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: ${{ github.ref_name != 'master' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build native binary
        run: go build -tags release .

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build for GitHub Pages
        run: |
          go build -o web/ebiten-template.wasm .
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/
        env:
          GOOS: js
          GOARCH: wasm

      - name: Inject Google Analytics
        if: github.ref_name == 'master' && env.GOOGLE_ANALYTICS_ID != ''
        uses: remarkablemark/google-analytics-action@v1
        with:
          html-path: web/index.html
          measurement-id: ${{ env.GOOGLE_ANALYTICS_ID }}

      - name: Deploy to GitHub Pages
        if: github.ref_name == 'master'
        uses: remarkablemark/gitploy-action@v1
        with:
          directory: web
