name: release-please
on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: go

  itch:
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Get variables
        id: vars
        shell: bash
        run: |
          echo "app_name=$(jq -r .short_name web/manifest.webmanifest)" >> "$GITHUB_OUTPUT"
          echo "window_title=$(jq -r .name web/manifest.webmanifest)" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "platform=$(echo $RUNNER_OS | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        env:
          TAG_NAME: ${{ needs.release.outputs.tag_name }}

      - name: Build web
        if: runner.os == 'Linux'
        uses: ./.github/actions/build-web

      - name: Setup butler
        uses: remarkablegames/setup-butler@v3

      - name: Upload web build
        if: runner.os == 'Linux'
        working-directory: web
        run: |
          butler push . $GITHUB_REPOSITORY:html5 --userversion ${{ steps.vars.outputs.version }}
          zip -r web.zip .
          gh release upload ${{ needs.release.outputs.tag_name }} web.zip
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          GH_TOKEN: ${{ github.token }}

      - name: Create dist
        shell: bash
        run: mkdir -p dist

      - name: Build Linux binary
        if: runner.os == 'Linux'
        run: go build -tags release -o "dist/${{ steps.vars.outputs.app_name }}" .

      - name: Build macOS binary
        if: runner.os == 'macOS'
        run: |
          env CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags release -o "${APP_NAME}_arm64" .
          env CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -tags release -o "${APP_NAME}_amd64" .
          lipo "${APP_NAME}_arm64" "${APP_NAME}_amd64" -create -o "${APP_NAME}"
          rm "${APP_NAME}_arm64" "${APP_NAME}_amd64"
        env:
          APP_NAME: ${{ steps.vars.outputs.app_name }}

      - name: Package macOS app
        if: runner.os == 'macOS'
        uses: remarkablemark/package-macos-app@v1
        with:
          binary: ./${{ steps.vars.outputs.app_name }}
          bundle-id: org.remarkablegames.${{ steps.vars.outputs.app_name }}
          version: ${{ steps.vars.outputs.version }}
          icon: assets/icons/icon.icns
          output: dist

      - name: Embed Windows icon
        if: runner.os == 'Windows'
        run: >
          go run github.com/tc-hib/go-winres@v0.3.3 simply
          --arch amd64
          --icon assets/icons/icon.ico
          --manifest none
          --file-version "${{ steps.vars.outputs.version }}"
          --product-version "${{ steps.vars.outputs.version }}"
          --product-name "${{ steps.vars.outputs.window_title }}"
          --file-description "${{ steps.vars.outputs.window_title }}"
          --original-filename "${{ steps.vars.outputs.app_name }}.exe"

      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: go build -tags release -ldflags="-H=windowsgui" -o "dist/${{ steps.vars.outputs.app_name }}.exe" .

      - name: Upload app to itch.io
        run: butler push dist ${{ github.repository }}:${{ steps.vars.outputs.platform }} --userversion ${{ steps.vars.outputs.version }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

      - name: Upload Release Artifact
        working-directory: dist
        shell: bash
        run: |
          if [[ $RUNNER_OS == 'Windows' ]]; then
            7z a -r $PLATFORM.zip ./*
          else
            zip -r $PLATFORM.zip .
          fi
          gh release upload ${{ needs.release.outputs.tag_name }} $PLATFORM.zip
        env:
          PLATFORM: ${{ steps.vars.outputs.platform }}
          GH_TOKEN: ${{ github.token }}

  wavedash:
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build web
        uses: ./.github/actions/build-web

      - name: Upload to Wavedash
        uses: remarkablegames/wavedash-action@v2
        with:
          token: ${{ secrets.WAVEDASH_TOKEN }}
          game-id: ${{ secrets.WAVEDASH_GAME_ID }}
          build-message: ${{ needs.release.outputs.tag_name }}
          upload-dir: web
