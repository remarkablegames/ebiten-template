name: release-please
on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: go

  itch:
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Get variables
        id: vars
        shell: bash
        run: |
          echo "app_name=$(jq -r .short_name web/manifest.webmanifest)" >> "$GITHUB_OUTPUT"
          echo "window_title=$(jq -r .name web/manifest.webmanifest)" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "platform=$(echo $RUNNER_OS | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        env:
          TAG_NAME: ${{ needs.release.outputs.tag_name }}

      - name: Build web
        if: runner.os == 'Linux'
        run: |
          go build -o web/ebiten-template.wasm .
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/
        env:
          GOOS: js
          GOARCH: wasm

      - name: Setup butler
        uses: remarkablegames/setup-butler@v3

      - name: Upload web build
        if: runner.os == 'Linux'
        working-directory: web
        run: |
          butler push . $GITHUB_REPOSITORY:html5 --userversion ${{ steps.vars.outputs.version }}
          zip -r web.zip .
          gh release upload ${{ needs.release.outputs.tag_name }} web.zip
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          GH_TOKEN: ${{ github.token }}

      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist
          case "$RUNNER_OS" in
            macOS)
              env CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags release -o "dist/${APP_NAME}_arm64" .
              env CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -tags release -o "dist/${APP_NAME}_amd64" .
              lipo "dist/${APP_NAME}_arm64" "dist/${APP_NAME}_amd64" -create -o "dist/${APP_NAME}"
              rm "dist/${APP_NAME}_arm64" "dist/${APP_NAME}_amd64"
              ;;
            Windows)
              go build -tags release -ldflags="-H=windowsgui" -o "dist/${APP_NAME}.exe" .
              ;;
            *)
              go build -tags release -o "dist/${APP_NAME}" .
              ;;
          esac
        env:
          APP_NAME: ${{ steps.vars.outputs.app_name }}

      - name: Upload app to itch.io
        run: butler push dist ${{ github.repository }}:${{ steps.vars.outputs.platform }} --userversion ${{ steps.vars.outputs.version }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

      - name: Upload Release Artifact
        working-directory: dist
        shell: bash
        run: |
          if [[ $RUNNER_OS == 'Windows' ]]; then
            7z a -r $PLATFORM.zip ./*
          else
            zip -r $PLATFORM.zip .
          fi
          gh release upload ${{ needs.release.outputs.tag_name }} $PLATFORM.zip
        env:
          PLATFORM: ${{ steps.vars.outputs.platform }}
          GH_TOKEN: ${{ github.token }}

  wavedash:
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build web
        run: |
          go build -o web/ebiten-template.wasm .
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/
        env:
          GOOS: js
          GOARCH: wasm

      - name: Upload to Wavedash
        uses: remarkablegames/wavedash-action@v2
        with:
          token: ${{ secrets.WAVEDASH_TOKEN }}
          game-id: ${{ secrets.WAVEDASH_GAME_ID }}
          build-message: ${{ needs.release.outputs.tag_name }}
          upload-dir: web
