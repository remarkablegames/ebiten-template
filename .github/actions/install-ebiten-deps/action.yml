name: Install Ebitengine dependencies
description: Install the system libraries Ebitengine needs to compile on Linux
runs:
  using: composite
  steps:
    - name: Install packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libc6-dev libglu1-mesa-dev libgl1-mesa-dev \
          libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
          libxxf86vm-dev libasound2-dev pkg-config
